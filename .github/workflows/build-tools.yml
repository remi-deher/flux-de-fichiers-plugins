# Construit les artefacts réels des outils distribués (Option B) à partir des recettes
# `apps/<outil>/build.json`, sans jamais écraser une Release publiée (`--clobber` réservé aux brouillons).
#
# Chaque outil est publié dans sa propre Release immuable (`<releaseTagPrefix>-<toolVersion>`),
# créée en brouillon (--draft) puis publiée après téléversement des archives, des métadonnées
# multi-binaires et de `SHA256SUMS.txt`. Le job final met à jour `distribution.v1.json`,
# régénère `catalogue/index.json` et ouvre une Pull Request vers `dev`.
name: build-tools

on:
  workflow_dispatch:
    inputs:
      tool:
        description: "Slug de l'app à construire (all ou slug d'un dossier apps/<slug>/build.json)"
        required: true
        default: 'all'
      release_tag_suffix:
        description: "Suffixe optionnel pour un tag neuf (ex. r2 si 1.0.0 existe déjà)"
        required: false
        default: ''
  push:
    branches: [dev]
    paths:
      - '.github/workflows/build-tools.yml'
      - 'apps/*/build.json'

concurrency:
  group: build-tools-${{ github.event.inputs.tool || 'all' }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  discover:
    name: découvrir les recettes
    runs-on: ubuntu-latest
    outputs:
      tools: ${{ steps.list.outputs.tools }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILTER="${{ github.event.inputs.tool || 'all' }}"
          SUFFIX="${{ github.event.inputs.release_tag_suffix || '' }}"
          python3 - "$FILTER" "$SUFFIX" "${{ github.event_name }}" <<'PY'
          import json, os, pathlib, subprocess, sys
          filt, suffix, event = sys.argv[1], sys.argv[2], sys.argv[3]

          def published(tag):
              res = subprocess.run(["gh", "release", "view", tag, "--json", "isDraft", "-q", ".isDraft"],
                                   capture_output=True, text=True)
              return res.returncode == 0 and res.stdout.strip() == "false"

          items = []
          for p in sorted(pathlib.Path("apps").glob("*/build.json")):
              d = json.loads(p.read_text())
              slug = d["slug"]
              if filt != "all" and slug != filt:
                  continue
              tag = f"{d['releaseTagPrefix']}-{d['toolVersion']}"
              if suffix:
                  tag = f"{tag}-{suffix}"
              # Sur push, seuls les outils pas encore distribués sont construits : un contrat
              # déjà « released » ou une Release déjà publiée (immuable) est ignoré.
              if event == "push":
                  dist = json.loads((p.parent / "distribution.v1.json").read_text())
                  if dist.get("releaseStatus") == "released" or published(tag):
                      print(f"{slug} ({tag}) déjà distribué : ignoré")
                      continue
              items.append({"slug": slug, "tag": tag})
          if not items and event != "push":
              raise SystemExit(f"Aucune recette trouvée pour tool={filt!r}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write("tools=" + json.dumps(items) + "\n")
          PY

  preflight:
    name: vérifier immutabilité des tags
    needs: discover
    if: needs.discover.outputs.tools != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TOOLS_JSON: ${{ needs.discover.outputs.tools }}
        run: |
          for tag in $(echo "$TOOLS_JSON" | jq -r '.[].tag'); do
            if gh release view "$tag" --json isDraft -q .isDraft >/tmp/draft_flag 2>/dev/null; then
              if [ "$(cat /tmp/draft_flag)" != "true" ]; then
                echo "::error::La release '$tag' est déjà publiée et immuable. Incrémentez toolVersion ou fournissez release_tag_suffix."
                exit 1
              fi
            fi
          done

  bundle:
    name: build-${{ matrix.tool.slug }}-${{ matrix.arch.arch }}
    needs: [discover, preflight]
    runs-on: ${{ matrix.arch.runner }}
    permissions:
      contents: write
    strategy:
      # Chaque outil est indépendant : un échec n'annule pas les autres constructions.
      fail-fast: false
      matrix:
        tool: ${{ fromJson(needs.discover.outputs.tools) }}
        arch:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Écrire le script de construction depuis build.json
        run: |
          cat > bundle.sh <<'SCRIPT'
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          RECIPE="/work/apps/${SLUG}/build.json"
          # python3 est installé avant toute lecture de la recette (absent de debian:bookworm).
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends patchelf python3 ca-certificates >/dev/null
          SOURCE_KIND=$(python3 -c "import json; print(json.load(open('$RECIPE'))['source']['kind'])")

          if [ "$SOURCE_KIND" = "debian-bookworm" ]; then
            PKGS=$(python3 -c "import json; print(' '.join(json.load(open('$RECIPE'))['source']['packages']))")
            apt-get install -y -qq --no-install-recommends $PKGS >/dev/null
            MAIN_PKG=$(python3 -c "import json; print(json.load(open('$RECIPE'))['source']['packages'][0])")
            UPSTREAM_VER=$(dpkg-query -W -f='${Version}' "$MAIN_PKG")
            SOURCE_REF="$MAIN_PKG"
          elif [ "$SOURCE_KIND" = "gpac-git" ]; then
            GPAC_TAG=$(python3 -c "import json; print(json.load(open('$RECIPE'))['source']['gitRef'])")
            apt-get install -y -qq --no-install-recommends git build-essential pkg-config zlib1g-dev >/dev/null
            git clone --depth 1 --branch "${GPAC_TAG}" https://github.com/gpac/gpac.git /tmp/gpac
            (
              cd /tmp/gpac
              ./configure --static-bin
              make -j"$(nproc)"
              install -m 0755 bin/gcc/MP4Box /usr/local/bin/MP4Box
            )
            UPSTREAM_VER="${GPAC_TAG}"
            SOURCE_REF="https://github.com/gpac/gpac/tree/${GPAC_TAG}"
          elif [ "$SOURCE_KIND" = "cargo-crate" ]; then
            # Image rust:<rustToolchain>-bookworm : même glibc que l'image d'exécution.
            CRATE=$(python3 -c "import json; print(json.load(open('$RECIPE'))['source']['crate'])")
            CRATE_VER=$(python3 -c "import json; print(json.load(open('$RECIPE'))['source']['crateVersion'])")
            cargo install --locked --root /usr/local "$CRATE" --version "$CRATE_VER"
            UPSTREAM_VER="$CRATE $CRATE_VER ($(rustc --version))"
            SOURCE_REF="https://crates.io/crates/$CRATE/$CRATE_VER"
          elif [ "$SOURCE_KIND" = "upstream-archives" ]; then
            # libatomic1 : requise par Node.js, absente de bookworm et bookworm-slim (embarquée).
            apt-get install -y -qq --no-install-recommends binutils libatomic1 xz-utils >/dev/null
            UPSTREAM_VER=$(python3 -c "import json; print(', '.join(a['upstreamVersion'] for a in json.load(open('$RECIPE'))['source']['archives']))")
            SOURCE_REF="archives amont épinglées"
          else
            echo "Source inconnue : $SOURCE_KIND" >&2
            exit 1
          fi

          GLIBC='/(ld-linux[^/]*|libc|libm|libdl|libpthread|librt|libresolv|libutil|libnsl|libanl)\.so'
          stage="/tmp/stage/$SLUG"
          rm -rf "$stage"; mkdir -p "$stage/lib"

          mapfile -t BINS < <(python3 -c "import json; print('\n'.join(json.load(open('$RECIPE'))['binaries']))")
          mapfile -t PROBE < <(python3 -c "import json; print('\n'.join(json.load(open('$RECIPE'))['probeArgs']))")

          if [ "$SOURCE_KIND" = "upstream-archives" ]; then
            # Télécharge chaque archive amont, vérifie son SHA-256 épinglé, l'extrait dans
            # <extractTo>/, élague, remplace les liens symboliques (refusés par le cache du
            # cœur) par des copies, puis expose chaque binaire par un lanceur sh à la racine.
            python3 - "$RECIPE" "$ARCH" "$stage" <<'PY'
          import hashlib, json, os, pathlib, re, shutil, subprocess, sys, urllib.request
          recipe_path, arch, stage = sys.argv[1], sys.argv[2], pathlib.Path(sys.argv[3])
          GLIBC = re.compile(r"/(ld-linux[^/]*|libc|libm|libdl|libpthread|librt|libresolv|libutil|libnsl|libanl)\.so")

          def bundle_shared_libs(real):
              """Copie dans <stage>/lib les dépendances hors glibc et pointe le rpath du binaire dessus."""
              res = subprocess.run(["ldd", str(real)], capture_output=True, text=True)
              if res.returncode != 0:
                  return
              deps = []
              for line in res.stdout.splitlines():
                  if "not found" in line:
                      raise SystemExit(f"dépendance introuvable pour {real} : {line.strip()}")
                  _, sep, rest = line.partition("=>")
                  path = rest.split("(")[0].strip()
                  if sep and path.startswith("/") and not GLIBC.search(path):
                      deps.append(path)
              if not deps:
                  return
              libdir = stage / "lib"
              libdir.mkdir(exist_ok=True)
              for dep in deps:
                  shutil.copy2(os.path.realpath(dep), libdir / os.path.basename(dep))
              rpath = "$ORIGIN/" + os.path.relpath(libdir, real.parent)
              subprocess.run(["patchelf", "--force-rpath", "--set-rpath", rpath, str(real)], check=True)
              print(f"{real.name} : {len(deps)} bibliothèque(s) embarquée(s), rpath {rpath}")
          recipe = json.load(open(recipe_path))
          wanted = set(recipe["binaries"])
          exposed = set()
          clashes = wanted & {a["extractTo"] for a in recipe["source"]["archives"]}
          if clashes:
              raise SystemExit(f"extractTo en collision avec un lanceur : {sorted(clashes)}")
          for item in recipe["source"]["archives"]:
              url, expected = item["urls"][arch], item["sha256"][arch]
              archive = pathlib.Path("/tmp") / url.rsplit("/", 1)[-1]
              with urllib.request.urlopen(url) as resp, open(archive, "wb") as out:
                  shutil.copyfileobj(resp, out)
              actual = hashlib.sha256(archive.read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit(f"SHA-256 inattendu pour {url} : {actual} != {expected}")
              root = stage / item["extractTo"]
              root.mkdir(parents=True)
              archive_format = item.get("format", "tar.gz")
              if archive_format == "binary":
                  # Exécutable publié tel quel : chaque point d'entrée en reçoit une copie.
                  for rel in item["entrypoints"].values():
                      target = root / rel
                      target.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copy(archive, target)
                      target.chmod(0o755)
              else:
                  tar_flag = "-xJf" if archive_format == "tar.xz" else "-xzf"
                  subprocess.run(["tar", tar_flag, str(archive), "-C", str(root), "--no-same-owner",
                                  f"--strip-components={item['stripComponents']}"], check=True)
              for pattern in item.get("prune", []):
                  for victim in sorted(root.glob(pattern), reverse=True):
                      if victim.is_dir() and not victim.is_symlink():
                          shutil.rmtree(victim)
                      else:
                          victim.unlink()
              for dirpath, dirnames, filenames in os.walk(root):
                  for name in dirnames + filenames:
                      link = pathlib.Path(dirpath) / name
                      if not link.is_symlink():
                          continue
                      target = link.resolve()
                      if not target.exists():
                          link.unlink()
                      elif target.is_file() and target.is_relative_to(root):
                          link.unlink()
                          shutil.copy2(target, link)
                      else:
                          raise SystemExit(f"lien symbolique non pris en charge : {link} -> {target}")
              if item.get("strip"):
                  for dirpath, _, filenames in os.walk(root):
                      for name in filenames:
                          path = pathlib.Path(dirpath) / name
                          with open(path, "rb") as fh:
                              is_elf = fh.read(4) == b"\x7fELF"
                          if is_elf:
                              subprocess.run(["strip", "--strip-unneeded", str(path)], check=True)
              for name, rel in item["entrypoints"].items():
                  real = root / rel
                  if not real.is_file():
                      raise SystemExit(f"point d'entrée absent : {real}")
                  bundle_shared_libs(real)
                  launcher = stage / name
                  # Concaténation volontaire : « $ » + « { » évite toute expression GitHub Actions.
                  script_dir = "$" + "{0%/*}"
                  launcher.write_text("#!/bin/sh\nexec \"" + script_dir + "/" + item["extractTo"] + "/" + rel + "\" \"$@\"\n")
                  launcher.chmod(0o755)
                  exposed.add(name)
          if exposed != wanted:
              raise SystemExit(f"binaires exposés {sorted(exposed)} != binaries {sorted(wanted)}")
          PY
          else
            for binary in "${BINS[@]}"; do
              cp "$(command -v "$binary")" "$stage/$binary"
              (ldd "$stage/$binary" 2>/dev/null || true) | awk '/=> \//{print $3}'
            done | sort -u | { grep -Ev "$GLIBC" || true; } | while read -r library; do
              [ -e "$library" ] && cp -L "$library" "$stage/lib/"
            done
          fi

          for binary in "${BINS[@]}"; do
            if ldd "$stage/$binary" >/dev/null 2>&1; then
              patchelf --force-rpath --set-rpath '$ORIGIN/lib' "$stage/$binary"
            fi
          done
          for library in "$stage"/lib/*; do
            [ -e "$library" ] || continue
            patchelf --set-rpath '$ORIGIN' "$library"
          done
          # Données embarquées (ex. tessdata) puis lanceurs posant les variables d'environnement.
          python3 - "$RECIPE" "$stage" <<'PY'
          import json, pathlib, shutil, sys
          recipe, stage = json.load(open(sys.argv[1])), pathlib.Path(sys.argv[2])
          for data in recipe.get("dataPaths", []):
              shutil.copytree(data["from"], stage / data["to"], symlinks=False, dirs_exist_ok=True)
          env = recipe.get("launcherEnv", {})
          if env:
              libexec = stage / "libexec"
              libexec.mkdir(exist_ok=True)
              for binary in recipe["binaries"]:
                  shutil.move(stage / binary, libexec / binary)
                  exports = "".join(
                      'export ' + name + '="${0%/*}/' + rel + '"\n' for name, rel in env.items()
                  )
                  launcher = stage / binary
                  launcher.write_text("#!/bin/sh\n" + exports + 'exec "${0%/*}/libexec/' + binary + '" "$@"\n')
                  launcher.chmod(0o755)
          PY
          if [ -d "$stage/libexec" ]; then
            for binary in "${BINS[@]}"; do
              if ldd "$stage/libexec/$binary" >/dev/null 2>&1; then
                patchelf --force-rpath --set-rpath '$ORIGIN/../lib' "$stage/libexec/$binary"
              fi
            done
          fi
          # Sortie capturée puis tronquée : `| head` couperait le tuyau (SIGPIPE, code 141 sous pipefail).
          for binary in "${BINS[@]}"; do
            env -i "$stage/$binary" "${PROBE[@]}" > /tmp/probe.out 2>&1
            head -n 1 /tmp/probe.out
          done

          {
            if [ "$SOURCE_KIND" = "debian-bookworm" ]; then
              echo "Outil : $SLUG (paquet Debian bookworm $SOURCE_REF $UPSTREAM_VER)"
              echo "Sources : https://sources.debian.org/src/$SOURCE_REF/"
            elif [ "$SOURCE_KIND" = "cargo-crate" ]; then
              echo "Outil : $SLUG ($UPSTREAM_VER)"
              echo "Sources : $SOURCE_REF"
            elif [ "$SOURCE_KIND" = "upstream-archives" ]; then
              echo "Outil : $SLUG ($SOURCE_REF)"
              python3 -c "import json, sys; [print(f\"  {a['upstreamVersion']} : {a['urls'][sys.argv[1]]} (sha256 {a['sha256'][sys.argv[1]]})\") for a in json.load(open('$RECIPE'))['source']['archives']]" "$ARCH"
            else
              echo "Outil : $SLUG ($SOURCE_REF)"
            fi
            echo "Bibliothèques embarquées (paquet, version) :"
            for library in "$stage"/lib/*; do
              [ -e "$library" ] || continue
              owner=$(dpkg -S "$(basename "$library")" 2>/dev/null | head -n 1 | cut -d: -f1 || true)
              [ -n "$owner" ] && echo "  $(basename "$library") : $owner $(dpkg-query -W -f='${Version}' "$owner")"
            done
          } > "$stage/SOURCES.txt"

          archive="/out/$SLUG-linux-$ARCH.tar.gz"
          tar -C "$stage" -czf "$archive" --owner=0 --group=0 --numeric-owner .

          python3 - "$SLUG" "$ARCH" "$archive" "$stage" "$UPSTREAM_VER" "${BINS[@]}" > "/out/$SLUG-$ARCH.json" <<'PY'
          import hashlib, json, pathlib, sys
          slug, arch, archive, stage, upstream_ver, *bins = sys.argv[1:]
          def h(p):
              return hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          binaries_map = {
              b: {"relativePath": b, "sha256": h(pathlib.Path(stage) / b)}
              for b in bins
          }
          main = bins[0]
          print(json.dumps({
              "tool": slug,
              "arch": arch,
              "file": pathlib.Path(archive).name,
              "archiveSha256": h(archive),
              "binarySha256": binaries_map[main]["sha256"],
              "binaryRelativePath": main,
              "binaries": binaries_map,
              "upstreamVersion": upstream_ver,
          }))
          PY
          SCRIPT

      - name: Construire et tester dans debian:bookworm / bookworm-slim
        run: |
          mkdir out
          # Compilation cargo : image rust:<rustToolchain>-bookworm (glibc de bookworm) ; sinon Debian.
          BUILD_IMAGE=$(python3 -c "import json, sys; s = json.load(open(sys.argv[1]))['source']; print(f\"rust:{s['rustToolchain']}-bookworm\" if s['kind'] == 'cargo-crate' else 'debian:bookworm')" "apps/${{ matrix.tool.slug }}/build.json")
          docker run --rm -e ARCH=${{ matrix.arch.arch }} -e SLUG=${{ matrix.tool.slug }} \
            -v "$PWD:/work:ro" -v "$PWD/out:/out" \
            "$BUILD_IMAGE" bash /work/bundle.sh

          # bookworm-slim n'a pas python3 : binaires et arguments de sonde sont lus sur l'hôte.
          RECIPE="apps/${{ matrix.tool.slug }}/build.json"
          BINS=$(python3 -c "import json, sys; print(' '.join(json.load(open(sys.argv[1]))['binaries']))" "$RECIPE")
          PROBE=$(python3 -c "import json, sys; print(' '.join(json.load(open(sys.argv[1]))['probeArgs']))" "$RECIPE")
          docker run --rm -e ARCH=${{ matrix.arch.arch }} -e SLUG=${{ matrix.tool.slug }} \
            -e BINS="$BINS" -e PROBE="$PROBE" \
            -v "$PWD/out:/out:ro" debian:bookworm-slim bash -euo pipefail -c '
              mkdir -p "/t/$SLUG"
              tar -C "/t/$SLUG" -xzf "/out/$SLUG-linux-${ARCH}.tar.gz"
              for binary in $BINS; do
                env -i "/t/$SLUG/$binary" $PROBE
              done
            '

      - name: Publier les artefacts en brouillon (Release immuable)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ matrix.tool.tag }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --target "${{ github.sha }}" \
              --title "Outil ${{ matrix.tool.slug }} ($TAG)" \
              --notes "Archive autonome Option B (Debian bookworm). Release immuable générée par build-tools.yml." || true
          fi
          for attempt in 1 2 3 4 5; do
            gh release view "$TAG" >/dev/null 2>&1 && break
            sleep 3
          done
          IS_DRAFT=$(gh release view "$TAG" --json isDraft -q .isDraft)
          if [ "$IS_DRAFT" != "true" ]; then
            echo "::error::Refus d'écrire sur une release déjà publiée ($TAG)"
            exit 1
          fi
          # Release encore en brouillon (vérifié ci-dessus) : une relance remplace ses fichiers.
          gh release upload "$TAG" out/*.tar.gz out/*.json --clobber

  publish-and-pr:
    name: publier releases et ouvrir PR contrats
    needs: [discover, bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer jsonschema
        run: python -m pip install --no-cache-dir jsonschema

      - name: Finaliser SHA256SUMS, publier les Releases et mettre à jour distribution.v1.json
        env:
          GH_TOKEN: ${{ github.token }}
          TOOLS_JSON: ${{ needs.discover.outputs.tools }}
        run: |
          mkdir -p meta
          for row in $(echo "$TOOLS_JSON" | jq -c '.[]'); do
            slug=$(echo "$row" | jq -r .slug)
            tag=$(echo "$row" | jq -r .tag)
            mkdir -p "meta/$slug"
            gh release download "$tag" --dir "meta/$slug"
            (cd "meta/$slug" && sha256sum *.tar.gz > SHA256SUMS.txt)
            gh release upload "$tag" "meta/$slug/SHA256SUMS.txt"
            gh release edit "$tag" --draft=false
            released_at=$(gh release view "$tag" --json publishedAt -q '.publishedAt[:10]')

            file="apps/$slug/distribution.v1.json"
            for arch in x86_64 aarch64; do
              meta="meta/$slug/$slug-$arch.json"
              url="https://github.com/${{ github.repository }}/releases/download/$tag/$slug-linux-$arch.tar.gz"
              jq --arg arch "$arch" --arg url "$url" --arg released "$released_at" \
                 --slurpfile m "$meta" \
                 '(.artifacts[] | select(.arch == $arch)) |= (
                    .archiveUrl = $url
                    | .archiveSha256 = $m[0].archiveSha256
                    | .binarySha256 = $m[0].binarySha256
                    | .binaryRelativePath = $m[0].binaryRelativePath
                    | .binaries = $m[0].binaries
                  )
                  | .upstreamVersion = $m[0].upstreamVersion
                  | .releaseStatus = "released"
                  | .releasedAt = $released' \
                 "$file" > "$file.tmp"
              mv "$file.tmp" "$file"
            done
          done

      - name: Régénérer l'index et valider
        run: |
          python3 scripts/build_index.py
          python3 scripts/check_catalogue.py --require-jsonschema

      - name: Ouvrir une Pull Request vers dev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "Aucune modification des contrats."
            exit 0
          fi
          BRANCH="chore/tools-release-$(date +%Y%m%d%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add apps/*/distribution.v1.json index.json
          git commit -m "chore(apps): mise à jour contrats de distribution immuables"
          git push origin "$BRANCH"
          # Corps entre apostrophes : des backticks entre guillemets seraient exécutés par bash.
          BODY='Contrats `distribution.v1.json` et empreintes `index.json` mis à jour automatiquement après publication de releases immuables (sans `--clobber`).'
          if ! gh pr create --base dev --head "$BRANCH" \
            --title "chore(apps): publication immuable des outils Option B" \
            --body "$BODY"; then
            # Le dépôt peut interdire à GitHub Actions d'ouvrir des PR : la branche reste poussée.
            echo "::warning::PR non créée par Actions ; ouvrez-la depuis https://github.com/${{ github.repository }}/compare/dev...$BRANCH"
          fi
