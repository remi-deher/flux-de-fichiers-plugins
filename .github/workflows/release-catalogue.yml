# Publie une Release immuable complète du catalogue : sur tag `catalogue-vX.Y.Z`, sur déclenchement
# manuel, ou appelée par `auto-release.yml` après chaque fusion dans `main` (version calculée).
# Fige `releaseVersion`, vérifie l'intégralité des empreintes SHA-256 (`--strict-immutable`),
# puis crée une Release GitHub en brouillon avant publication (compatible GitHub Immutable Releases).
name: release-catalogue

on:
  push:
    tags:
      - 'catalogue-v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Version SemVer du catalogue à publier (ex. 1.0.0)"
        required: true
  workflow_call:
    inputs:
      version:
        description: "Version SemVer du catalogue à publier (ex. 1.0.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: release catalogue immuable
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer jsonschema
        run: python -m pip install --no-cache-dir jsonschema

      - name: Figer releaseVersion et valider en mode --strict-immutable
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
            TAG="catalogue-v${VERSION}"
          else
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#catalogue-v}"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version invalide : '${VERSION}' (attendu X.Y.Z)"
            exit 1
          fi
          echo "RELEASE_TAG=${TAG}" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${VERSION}" >> "$GITHUB_ENV"

          python3 scripts/build_index.py --release-version "$VERSION"
          python3 scripts/build_index.py --check
          python3 scripts/check_catalogue.py --require-jsonschema --strict-immutable
          python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Empaqueter le bundle et publier en Release immuable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft -q .isDraft >/tmp/draft 2>/dev/null; then
            if [ "$(cat /tmp/draft)" != "true" ]; then
              echo "::error::La release '$RELEASE_TAG' est déjà publiée et immuable."
              exit 1
            fi
          fi
          mkdir -p dist
          cp index.json dist/index.json
          tar --exclude='.git' --exclude='dist' --exclude='__pycache__' -czf "dist/catalogue-${RELEASE_VERSION}.tar.gz" \
            index.json apps plugins flows scripts packs schema docs README.md
          (cd dist && sha256sum index.json "catalogue-${RELEASE_VERSION}.tar.gz" > SHA256SUMS.txt)

          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --draft --target "${{ github.sha }}" \
              --title "Catalogue Forgearr v${RELEASE_VERSION}" \
              --notes "Release immuable du catalogue v${RELEASE_VERSION} (empreintes SHA-256 complètes vérifiées par --strict-immutable)."
          fi
          gh release upload "$RELEASE_TAG" dist/*
          gh release edit "$RELEASE_TAG" --draft=false
