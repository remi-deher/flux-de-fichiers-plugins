# Workflow prêt à copier pour publier une Release immuable de votre dépôt tiers sur tag `vX.Y.Z`.
name: release-catalogue

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    name: release catalogue tiers immuable
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Récupérer ce dépôt tiers
        uses: actions/checkout@v4

      - name: Récupérer les schémas et outils officiels Flux de Fichiers
        uses: actions/checkout@v4
        with:
          repository: remi-deher/flux-de-fichiers-plugins
          ref: dev
          path: .flux-official

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer jsonschema
        run: python -m pip install --no-cache-dir jsonschema

      - name: Figer releaseVersion et valider en mode --strict-immutable
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "RELEASE_TAG=${TAG}" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${VERSION}" >> "$GITHUB_ENV"

          python3 .flux-official/scripts/build_index.py --root . --release-version "$VERSION"
          python3 .flux-official/scripts/check_catalogue.py \
            --root . \
            --schema-dir .flux-official/schema \
            --external-index .flux-official/index.json \
            --require-jsonschema \
            --strict-immutable

      - name: Publier la Release immuable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft -q .isDraft >/tmp/draft 2>/dev/null; then
            if [ "$(cat /tmp/draft)" != "true" ]; then
              echo "::error::La release '$RELEASE_TAG' est déjà publiée et immuable."
              exit 1
            fi
          fi
          mkdir -p dist
          cp index.json dist/index.json
          (cd dist && sha256sum index.json > SHA256SUMS.txt)
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --draft --target "${{ github.sha }}" \
              --title "Catalogue tiers ${RELEASE_TAG}" \
              --notes "Release immuable avec empreintes SHA-256 vérifiées."
          fi
          gh release upload "$RELEASE_TAG" dist/*
          gh release edit "$RELEASE_TAG" --draft=false
